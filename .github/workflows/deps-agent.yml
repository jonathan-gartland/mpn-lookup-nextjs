# When CI fails on a Dependabot PR, runs the dependency-updater agent
# (.claude/agents/dependency-updater.md) on that branch and pushes its fix.
name: Dependency Update Agent

on:
  workflow_run:
    workflows: ["Unit Tests", "Playwright Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Dependency update branch to fix"
        required: true

concurrency:
  group: deps-agent-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

jobs:
  fix:
    # Only runs on failed Dependabot CI. Runs re-triggered after the agent pushes are started by
    # github-actions[bot], not Dependabot, so the agent never re-runs on its own work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    timeout-minutes: 60
    # Playwright 1.49 browser deps target Ubuntu 24.04; ubuntu-latest (26.04) lacks them
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      # --ignore-scripts: newly updated packages must not run install scripts in a job that
      # holds a write token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dependency-updater agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the dependency-updater agent. Follow .claude/agents/dependency-updater.md exactly.
            Branch ${{ env.BRANCH }} updates dependencies and its CI is failing. Make it pass.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --permission-mode default
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(pnpm check-types),Bash(pnpm check-lint),Bash(pnpm test:*),Bash(pnpm build),Bash(pnpm exec playwright test:*),Bash(pnpm install --ignore-scripts:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --disallowedTools "Edit(src/util/mpn.lookup.ts),Write(src/util/mpn.lookup.ts),Edit(.github/**),Write(.github/**)"

      - name: Check protected files are unchanged
        id: guard
        run: |
          changed=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v '^\.agent-summary\.md$' || true)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          protected=$(echo "$changed" | grep -E '^(\.github/|src/util/mpn\.lookup\.ts$)' || true)
          if [ -n "$protected" ]; then
            echo "::error::Agent changed protected files:"
            echo "$protected"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify checks pass
        if: steps.guard.outputs.changed == 'true'
        run: |
          pnpm check-types
          pnpm test
          pnpm build
          pnpm exec playwright test --project=chromium

      - name: Push fix and re-run CI
        if: steps.guard.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.agent-summary.md'
          git commit -m "build(deps): fix dependency update (dependency-updater agent)"
          git push origin "HEAD:$BRANCH"
          gh workflow run test.yml --ref "$BRANCH"
          gh workflow run playwright.yml --ref "$BRANCH"

      - name: Comment on PR
        if: always() && steps.guard.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          [ -z "$pr" ] && exit 0
          if [ "${{ steps.guard.outputs.changed }}" = "true" ] && [ "${{ job.status }}" = "success" ]; then
            status="Pushed a fix; CI re-running."
          else
            status="Could not fix this automatically; needs a human."
          fi
          summary=$(cat .agent-summary.md 2>/dev/null || echo "(no summary)")
          gh pr comment "$pr" --body "**Dependency update agent:** $status

          $summary

          [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
