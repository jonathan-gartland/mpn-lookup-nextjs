# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Unit Tests

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]
  # Lets the deps agent re-run CI after pushing a fix (pushes with GITHUB_TOKEN don't trigger runs)
  workflow_dispatch:

jobs:
  # Job names are required status checks on main; renaming one needs a ruleset update.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - run: pnpm test

  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm check-types
    - name: Lint
      run: pnpm check-lint
    # The commit-msg hook only runs locally; make sure commitlint still accepts valid
    # messages and rejects invalid ones after dependency updates.
    - name: Commitlint smoke test
      run: |
        echo "ci(ci): smoke test" | pnpm exec commitlint
        if echo "not a conventional commit" | pnpm exec commitlint; then
          echo "::error::commitlint accepted an invalid message"
          exit 1
        fi
